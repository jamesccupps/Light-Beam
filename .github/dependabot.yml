# (2026-11-06, the user's review §11) The actions CI pins to commits, and npm's packages, kept current: a pull request a
# week at most for each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
